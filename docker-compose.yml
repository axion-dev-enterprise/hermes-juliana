version: '3.8'

services:
  hermes-gateway:
    build: .
    image: hermes-gateway-juliana:v5.1.0
    container_name: hermes-gateway-juliana
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - POSTGRES_URL=${POSTGRES_URL:?POSTGRES_URL is required}
      - HERMES_OPERATOR_TOKEN=${HERMES_OPERATOR_TOKEN:-}
      - HERMES_TEST_MODE=${HERMES_TEST_MODE:-false}
      - HERMES_SKILLS_DIR=/app/runtime-skills
      - HERMES_LOG_DIR=/app/HISTORY/audit/logs
    volumes:
      - ./docs:/app/docs
      - ./lib:/app/lib
      - hermes_audit:/app/HISTORY/audit
      - hermes_skills:/app/runtime-skills
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - hermes-network

  hermes-webchat:
    build:
      context: .
      dockerfile: Dockerfile.webchat
    image: hermes-webchat:v5.1.0
    container_name: hermes-webchat
    restart: always
    ports:
      - "80:80"
    depends_on:
      - hermes-gateway
    networks:
      - hermes-network

volumes:
  hermes_audit:
  hermes_skills:

networks:
  hermes-network:
    driver: bridge
