server {
    listen 80;
    server_name _;

    # Buffers and timeouts — LLM responses can take 60-120s
    client_max_body_size 25m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # ----- Deep healthcheck: real proxy to gateway, never cached -----
    location = /healthz {
        proxy_pass http://hermes-gateway:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Healthz-Edge "axion-nginx-1" always;
        access_log off;
    }

    # ----- LLM Chat: extended timeout (LLM inference pode demorar 60-120s) -----
    location = /api/v1/agent/chat {
        proxy_pass http://hermes-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control "no-store" always;
    }

    # ----- WhatsApp Webhook: também pode ser lento -----
    location = /api/v1/connectors/whatsapp/webhook {
        proxy_pass http://hermes-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_next_upstream off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # ----- API geral -----
    location /api/ {
        proxy_pass http://hermes-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_next_upstream off;
        proxy_intercept_errors on;
        add_header Cache-Control "no-store" always;
    }

    # ----- WebSocket gateway -----
    location /ws {
        proxy_pass http://hermes-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ----- SPA static (fallback to index.html for client routing) -----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ----- 5xx error page -----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }
}
