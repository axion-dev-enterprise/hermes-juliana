name: Hermes Juliana immutable CI and VPS deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: hermes-juliana-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GATEWAY_IMAGE: ghcr.io/axion-dev-enterprise/hermes-juliana-gateway
  WEBCHAT_IMAGE: ghcr.io/axion-dev-enterprise/hermes-juliana-webchat

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node --check server.js && node --check event_gateway.js && node --check scripts/migrate.js && node --check lib/tool_worker.js && node --check lib/tool_worker_child.js
      - run: npm test
      - run: node scripts/architecture_probe.js
      - name: Reject weak or committed credentials
        shell: bash
        run: |
          ! rg -n '(axion123|gh[pousr]_[A-Za-z0-9]{20,}|sk-or-[A-Za-z0-9_-]{20,})' . \
            --glob '!package-lock.json' --glob '!.github/workflows/hermes-vps.yml' --glob '!.git/**'

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      gateway_digest: ${{ steps.gateway.outputs.digest }}
      webchat_digest: ${{ steps.webchat.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/setup-buildx-action@v3
      - id: gateway
        uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: '${{ env.GATEWAY_IMAGE }}:${{ github.sha }}' }
      - id: webchat
        uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile.webchat, push: true, tags: '${{ env.WEBCHAT_IMAGE }}:${{ github.sha }}' }
      - uses: anchore/sbom-action@v0
        with: { image: '${{ env.GATEWAY_IMAGE }}@${{ steps.gateway.outputs.digest }}', artifact-name: gateway-sbom.spdx.json }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: '${{ env.GATEWAY_IMAGE }}@${{ steps.gateway.outputs.digest }}', severity: 'CRITICAL', exit-code: '1' }

  deploy:
    needs: publish
    runs-on: [self-hosted, linux, x64, juliana]
    environment: production
    steps:
      - name: Promote immutable images with migration and rollback
        env:
          GATEWAY_REF: ${{ env.GATEWAY_IMAGE }}@${{ needs.publish.outputs.gateway_digest }}
          WEBCHAT_REF: ${{ env.WEBCHAT_IMAGE }}@${{ needs.publish.outputs.webchat_digest }}
          OPERATOR_TOKEN: ${{ secrets.HERMES_OPERATOR_TOKEN }}
          DEMO_PASSWORD: ${{ secrets.HERMES_DEMO_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
            set -eu
            test "$(printf %s "$OPERATOR_TOKEN" | wc -c)" -ge 32
            cd /opt/hermes
            printf %s "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            previous_gateway=$(docker image inspect hermes-gateway-juliana:v5.1.0 --format '{{.Id}}' 2>/dev/null || true)
            previous_webchat=$(docker image inspect hermes-webchat:v5.1.0 --format '{{.Id}}' 2>/dev/null || true)
            docker pull "$GATEWAY_REF"
            docker pull "$WEBCHAT_REF"
            docker run --rm --network hermes_hermes-network --env-file /opt/hermes/.env "$GATEWAY_REF" npm run migrate
            sed -i '/^HERMES_OPERATOR_TOKEN=/d' /opt/hermes/.env
            sed -i '/^HERMES_DEMO_PASSWORD=/d' /opt/hermes/.env
            printf '\nHERMES_OPERATOR_TOKEN=%s\n' "$OPERATOR_TOKEN" >> /opt/hermes/.env
            printf '\nHERMES_DEMO_PASSWORD=%s\n' "$DEMO_PASSWORD" >> /opt/hermes/.env
            docker tag "$GATEWAY_REF" hermes-gateway-juliana:v5.1.0
            docker tag "$WEBCHAT_REF" hermes-webchat:v5.1.0
            docker rm -f hermes-events 2>/dev/null || true
            docker run -d --name hermes-events --restart always --network hermes_hermes-network --env-file /opt/hermes/.env --network-alias hermes-events "$GATEWAY_REF" node event_gateway.js
            if ! docker compose up -d --no-build --force-recreate hermes-gateway hermes-webchat || ! timeout 90 sh -c 'until docker exec hermes-gateway-juliana wget -qO- http://127.0.0.1:8000/healthz && docker exec hermes-events wget -qO- http://127.0.0.1:8001/healthz; do sleep 3; done'; then
              docker rm -f hermes-events 2>/dev/null || true
              test -n "$previous_gateway" && docker tag "$previous_gateway" hermes-gateway-juliana:v5.1.0
              test -n "$previous_webchat" && docker tag "$previous_webchat" hermes-webchat:v5.1.0
              docker compose up -d --no-build --force-recreate hermes-gateway hermes-webchat
              exit 1
            fi
            printf '%s\n%s\n' "$GATEWAY_REF" "$WEBCHAT_REF" > /opt/hermes/DEPLOYED_DIGESTS
