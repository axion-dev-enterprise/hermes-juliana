server {
    listen 80;
    server_name _;

    # Tighten buffers and timeouts for low-latency SPA + API hybrid
    client_max_body_size 25m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # ----- Deep healthcheck: real proxy to gateway, never cached -----
    location = /healthz {
        proxy_pass http://hermes-gateway:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Healthz-Edge "axion-nginx-1" always;
        access_log off;
    }

    # ----- API: also no-store + bypass 5xx caching -----
    location /api/ {
        proxy_pass http://hermes-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_next_upstream off;
        proxy_intercept_errors on;
        add_header Cache-Control "no-store" always;
    }

    # ----- WebSocket gateway -----
    location /ws {
        proxy_pass http://hermes-gateway-juliana:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ----- SPA static (fallback to index.html for client routing) -----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ----- 5xx: render 503 page directly, never cache -----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }
}
